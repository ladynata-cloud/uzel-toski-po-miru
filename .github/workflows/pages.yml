name: Publish literature site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_arm_runner:
        description: Use the GitHub-hosted Ubuntu ARM64 runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ (github.event_name == 'push' || inputs.use_arm_runner) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Download repository
        uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify all pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 build.py
          python3 verify_site.py
          node --check dist/assets/app.js
          node --check dist/assets/exam-practice.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ${{ (github.event_name == 'push' || inputs.use_arm_runner) && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
