name: Check reader workspace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reader-checks:
    name: Reader checks (${{ matrix.site_url }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site_url:
          - https://usel-toski-po-miru.art
          - https://ladynata-cloud.github.io/uzel-toski-po-miru
    steps:
      - name: Download pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and verify the reader site
        env:
          SITE_URL: ${{ matrix.site_url }}
          SITE_ASSISTANT_ORIGIN: ''
        run: |
          python3 build.py
          python3 verify_site.py
          node --check dist/assets/app.js
          node --check dist/assets/exam-practice.js
          node --check dist/assets/reader-search.js
          node --check dist/assets/reader-workshop.js
          node --test tests/reader-search.test.cjs tests/reader-workshop.test.cjs
